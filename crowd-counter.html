<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">
    <title>HTML Basics</title>
</head>
  <style>
  body{
    background-color:yellow;
  }
  div{
  display:flex;
  justify-content:center;
  align-items:center;
  transform: scale(120%);
  }
  </style>
<body>
<div>
<h1>Crowd Counter</h1>
<hr>
<form onSubmit="myConfirm()" method="post">
  <label for="session">Session: </label>
    <select id="slct" name="session">
    	<option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
    </select>
    <br>
    <br>
    <label for="time">Time: </label>
	<input id="time" name="time" type="text" value="09:15-09:45">
    <br>
    <br>
    <label for="visitor">Visitor: </label>
	<input id="visitor" name="visitor" type="text" value=0>
	<br>
	<br>
	<button type="button" id="btnPlus">Click Me +</button>
	<button type="button" id="btnMinus">Click Me -</button>
	<br>
	<br>
	<input id="submit" type="submit" name="submit">
</form>
<br>
<hr>
</div>
<script src="js/javascript.js" type="text/javascript">
</script>
<script src="js/csv.min.js" type="text/javascript">
</script>
</body>
</html>
